name: Update IPTV Playlist

on:
  schedule:
    # Запуск каждый день в 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run playlist script
        run: python IPTV/style/update_playlist.py

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add IPTV/assets/ropotel7844.m3u
          
          if git diff --staged --quiet; then
            echo "Изменений нет, коммит не требуется."
            exit 0
          fi
          
          # Полностью сбрасываем историю в один коммит, чтобы репозиторий не пух
          git checkout --orphan temp_branch
          git add IPTV/assets/ropotel7844.m3u
          git commit -m "Auto-update playlist [skip ci]"
          git branch -D main
          git branch -m main
          git push -f origin main
