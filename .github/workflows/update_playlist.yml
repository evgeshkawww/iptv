name: Update IPTV Playlist

on:
  schedule:
    # Запуск каждый день в 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run playlist script
        run: python update_playlist.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add IPTV/assets/ropotel7844.m3u
          if git diff --staged --quiet; then
            echo "Изменений нет, коммит не требуется."
          else
            git commit -m "Auto-update playlist [skip ci]"
            git push
          fi
