<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no" />
  <title>Premium IPTV Speed Test</title>
  <meta name="description" content="Тест скорости Premium IPTV" />
  <meta name="theme-color" content="#030712" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=DSEG7-Classic:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.min.css">

  <script type="text/javascript" src="js/speedtest.js"></script>
  <script src="https://premium-iptv.ru/color.js"></script>
  
  <style>
    :root {
      --bg-main: #030712;
      --bg-card: rgba(17, 24, 39, 0.75);
      --bg-card-hover: rgba(31, 41, 55, 0.85);
      --bg-inner: rgba(15, 23, 42, 0.6);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(245, 215, 110, 0.4);
      --gold: #f5d76e;
      --gold-gradient: linear-gradient(135deg, #ffe58f 0%, #d4af37 100%);
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.25);
      --digital-glow: 0 0 12px rgba(56, 189, 248, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(245, 215, 110, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.5) 0px, transparent 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .glass-card {
      position: relative;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    /* МАКСИМАЛЬНО ТОНКАЯ ШАПКА */
    .speed-header {
      padding: 10px 18px !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .speed-header .main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      line-height: 1;
    }

    /* АВТОРИЗАЦИЯ С ПУЛЬСИРУЮЩИМ ИНДИКАТОРОМ */
    .auth-status {
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg-inner);
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
    }

    .status-dot.ok {
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulseGreen 1.8s infinite;
    }

    .status-dot.err {
      background: #ef4444;
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: pulseRed 1.8s infinite;
    }

    @keyframes pulseGreen {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    @keyframes pulseRed {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .status-ok { color: #4ade80; font-weight: 700; }
    .status-error { color: #f87171; font-weight: 700; }

    /* LOADING CIRCLE */
    span.loadCircle {
      display: inline-block;
      width: 1.4em;
      height: 1.4em;
      vertical-align: middle;
      border: 2px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      margin-right: 0.6em;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(359deg);} }

    #loading {
      text-align: center;
      padding: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* CONTROLS */
    #serverArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .select-wrap {
      width: 100%;
      max-width: 360px;
    }

    #server {
      width: 100%;
      background: var(--bg-inner);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    #server:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-glow);
    }

    /* СТРОГАЯ КНОПКА С МЯГКИМ КРАСНЫМ */
    #startStopBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 360px;
      height: 42px;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: var(--radius-md);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    #startStopBtn:hover {
      background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
      border-color: #38bdf8;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }

    #startStopBtn:active {
      transform: translateY(1px);
    }

    /* Мягкий неядовитый цвет Прервать */
    #startStopBtn.running {
      background: linear-gradient(180deg, #8b2626 0%, #661818 100%) !important;
      color: #f1f1f1 !important;
      border-color: rgba(168, 50, 50, 0.6) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
    }

    #startStopBtn.running:hover {
      background: linear-gradient(180deg, #9e2b2b 0%, #7a1d1d 100%) !important;
      border-color: #ef4444 !important;
      box-shadow: 0 6px 20px rgba(168, 50, 50, 0.35) !important;
    }

    #startStopBtn:before {
      content: "Начать тест";
    }

    #startStopBtn.running:before {
      content: "Прервать тест";
    }

    #currentTest {
      width: 100%;
      min-height: 20px;
      display: flex;
      justify-content: center;
    }

    /* DASHBOARD */
    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .small-meters-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .digital-card {
      background: #020617;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .digital-card.main-meter {
      padding: 18px 16px;
      border-color: rgba(56, 189, 248, 0.25);
    }

    .meter-label {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .digital-screen {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
    }

    .digital-bg {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      color: rgba(255, 255, 255, 0.04);
      font-family: 'DSEG7-Classic', monospace;
      font-weight: 700;
      user-select: none;
      text-align: right;
    }

    .meterText {
      font-family: 'DSEG7-Classic', monospace;
      font-weight: 700;
      color: var(--cyan);
      text-shadow: var(--digital-glow);
      position: relative;
      z-index: 2;
      letter-spacing: 2px;
    }

    .small-meters-row .meterText,
    .small-meters-row .digital-bg { font-size: 2rem; }
    .main-meter .meterText,
    .main-meter .digital-bg { font-size: 3.2rem; }

    .meterText:empty:before { content: "0.00"; }

    .unit-tag {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ПРЕМИАЛЬНАЯ ПАНЕЛЬ ВЕРДИКТА */
    .verdict-card {
      width: 100%;
      max-width: 580px;
      padding: 14px 18px;
      border-radius: var(--radius-lg);
      background: var(--bg-inner);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .verdict-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .verdict-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-excellent {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
    }

    .badge-good {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #38bdf8;
    }

    .badge-warning {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid #f59e0b;
      color: #fbbf24;
    }

    .badge-bad {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }

    .verdict-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .verdict-metrics {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .metric-item strong {
      color: var(--cyan);
    }

    /* РЕЙТИНГ В ТАБЛИЦЕ (БЕЙДЖИ) */
    .table-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .tb-ultra { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .tb-good { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .tb-fair { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .tb-poor { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    /* RESULTS TABLE */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 14px;
      border-radius: var(--radius-lg);
      background: var(--bg-inner);
      border: 1px solid var(--border-subtle);
    }

    #multi_results {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    #multi_results th, #multi_results td {
      padding: 10px 8px;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    #multi_results th {
      background: rgba(15, 23, 42, 0.8);
      color: var(--gold);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
    }

    #multi_results td { color: var(--text-main); }
    #multi_results tbody tr:last-child td { border-bottom: none; }
    #multi_results tbody tr:hover { background: var(--bg-card-hover); }

    /* VISIBILITY */
    div.visible { animation: fadeIn 0.4s ease forwards; display: block; }
    div.hidden { display: none; }
    @keyframes fadeIn { 0%{ opacity:0; transform: translateY(6px); } 100%{ opacity:1; transform: translateY(0); } }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      padding-bottom: 16px;
    }

    @media (max-width: 600px) {
      body { padding: 12px 8px; }
      .glass-card { padding: 16px 12px; }
      .speed-header .main-title { font-size: 16px; }
      .small-meters-row .meterText,
      .small-meters-row .digital-bg { font-size: 1.5rem; }
      .main-meter .meterText,
      .main-meter .digital-bg { font-size: 2.4rem; }
      #multi_results th, #multi_results td { padding: 8px 4px; font-size: 0.7rem; }
    }

  <script type="text/javascript">
    function I(i){return document.getElementById(i);}
    
    function checkAuthServer() {
        const statusDiv = document.getElementById("authServerStatus");
        if (!statusDiv) return;
        statusDiv.innerHTML = `<span class="status-dot"></span><span>Проверка сервера авторизации...</span>`;
        let isResolved = false;
        
        const tryImage = (url, timeout = 4000) => {
            return new Promise((resolve) => {
                const img = new Image();
                let resolved = false;
                const timeoutId = setTimeout(() => {
                    if (!resolved) { resolved = true; resolve(false); }
                }, timeout);
                img.onload = () => {
                    if (!resolved) { resolved = true; clearTimeout(timeoutId); resolve(true); }
                };
                img.onerror = () => {
                    if (!resolved) { resolved = true; clearTimeout(timeoutId); resolve(false); }
                };
                img.src = url + "?_=" + Date.now();
            });
        };
        
        const tryScript = (url, timeout = 4000) => {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                let resolved = false;
                const timeoutId = setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        if (script.parentNode) script.parentNode.removeChild(script);
                        resolve(false);
                    }
                }, timeout);
                script.onload = () => {
                    if (!resolved) {
                        resolved = true;
                        clearTimeout(timeoutId);
                        if (script.parentNode) script.parentNode.removeChild(script);
                        resolve(true);
                    }
                };
                script.onerror = () => {
                    if (!resolved) {
                        resolved = true;
                        clearTimeout(timeoutId);
                        if (script.parentNode) script.parentNode.removeChild(script);
                        resolve(false);
                    }
                };
                script.src = url + "?_=" + Date.now();
                document.head.appendChild(script);
            });
        };
        
        Promise.all([
            tryImage("https://premium-iptv.ru/favicon.ico", 4000),
            tryScript("https://premium-iptv.ru/color.js", 4000)
        ]).then(([imgOk, scriptOk]) => {
            if (isResolved) return;
            isResolved = true;
            if (imgOk || scriptOk) {
                statusDiv.innerHTML = `<span class="status-dot ok"></span><span>Авторизация:</span> <span class="status-ok">ОК</span>`;
            } else {
                statusDiv.innerHTML = `<span class="status-dot err"></span><span>Авторизация:</span> <span class="status-error">ОФФЛАЙН</span>`;
            }
        });
        
        setTimeout(() => {
            if (!isResolved) {
                isResolved = true;
                statusDiv.innerHTML = `<span class="status-dot err"></span><span>Авторизация:</span> <span class="status-error">ОФФЛАЙН</span>`;
            }
        }, 4500);
    }
    
    var ipLoaded = false;

    function loadIpData(){
        ipLoaded = false;
        
        var xhr1 = new XMLHttpRequest();
        xhr1.open('GET', 'https://ipapi.co/json/', true);
        xhr1.onreadystatechange = function () {
            if (xhr1.readyState === 4 && xhr1.status === 200) {
                try {
                    var d = JSON.parse(xhr1.responseText);
                    formatIpData(d.ip, d.country, d.org, null);
                } catch(e){}
            }
        };
        xhr1.send();

        var xhr2 = new XMLHttpRequest();
        xhr2.open('GET', 'https://premium-iptv.ru/myip_info.php', true);
        xhr2.onreadystatechange = function () {
            if (xhr2.readyState === 4 && xhr2.status === 200) {
                try {
                    var d = JSON.parse(xhr2.responseText);
                    if (d && d.ip) {
                        var c = d.country_code || d.countryCode || d.iso_code || d.country;
                        formatIpData(d.ip, c, d.isp, d.vps);
                    }
                } catch(e){}
            }
        };
        xhr2.send();
    }

    function formatIpData(ip, countryStr, isp, vps){
        if (ipLoaded) return;
        ipLoaded = true;

        var cCode = "";
        if (countryStr) {
            cCode = String(countryStr).trim().toUpperCase();
            var countriesMap = {
                "BELARUS": "BY", "RUSSIA": "RU", "RUSSIAN FEDERATION": "RU",
                "UKRAINE": "UA", "KAZAKHSTAN": "KZ", "GERMANY": "DE",
                "POLAND": "PL", "LITHUANIA": "LT", "LATVIA": "LV",
                "ESTONIA": "EE", "MOLDOVA": "MD", "GEORGIA": "GE",
                "ARMENIA": "AM", "AZERBAIJAN": "AZ", "UZBEKISTAN": "UZ",
                "UNITED STATES": "US", "UNITED KINGDOM": "GB",
                "NETHERLANDS": "NL", "FRANCE": "FR", "SPAIN": "ES", "ITALY": "IT"
            };
            if (countriesMap[cCode]) cCode = countriesMap[cCode];
            else if (cCode.length > 2) cCode = cCode.substring(0, 2);
        }

        var isVpnDetected = !!vps;
        var ispUpper = (isp || "").toUpperCase();
        
        if (ispUpper.indexOf("HOSTING") > -1 ||
            ispUpper.indexOf("DATACENTER") > -1 ||
            ispUpper.indexOf("CLOUD") > -1 ||
            ispUpper.indexOf("DIGITALOCEAN") > -1 ||
            ispUpper.indexOf("AMAZON") > -1 ||
            ispUpper.indexOf("AWS") > -1 ||
            ispUpper.indexOf("HETZNER") > -1 ||
            ispUpper.indexOf("OVH") > -1 ||
            ispUpper.indexOf("PROXY") > -1 ||
            ispUpper.indexOf("VPN") > -1) {
            isVpnDetected = true;
        }
        
        var line1 = "<div style='display:flex; align-items:center; justify-content:center; gap:8px;'>";
        line1 += "<span style='color:var(--cyan); font-weight:700;'>IP: " + (ip || "?") + "</span>";
        
        if (cCode) {
            line1 += "<span style='background:rgba(245,215,110,0.15); color:var(--gold); border:1px solid var(--border-active); padding:2px 8px; border-radius:6px; font-weight:800; font-size:0.75rem; letter-spacing:0.5px;'>" + cCode + "</span>";
        }
        line1 += "</div>";

        var line2 = "";
        if (isVpnDetected) {
            line2 += "<span style='background:#ef4444; color:#fff; padding:2px 7px; border-radius:6px; font-weight:800; font-size:0.75rem; letter-spacing:0.5px;'>VPN</span>";
        }
        
        if (isp) {
            var space = isVpnDetected ? "<span style='margin-left:8px;'></span>" : "";
            line2 += space + isp;
        }

        var finalInfo = line1;
        if (line2) {
            finalInfo += "<div style='margin-top:4px; display:flex; align-items:center; justify-content:center; font-size:0.8rem; color:var(--text-muted);'>" + line2 + "</div>";
        }
        
        var el = document.getElementById("ipLocationInfoDisplay");
        if(el) el.innerHTML = finalInfo;
    }

    document.addEventListener('DOMContentLoaded', function() {
        checkAuthServer();
        setTimeout(initServers, 100);
        loadIpData(); 
    });
    
    var s=new Speedtest();
    s.setParameter("telemetry_level","basic");
    
    function initServers(){
        var noServersAvailable=function(){ I("message").innerHTML="Сервера недоступны"; }
        var runServerSelect=function(){
            s.selectServer(function(server){
                if(server!=null){
                    I("loading").className="hidden";
                    for(var i=0;i<SPEEDTEST_SERVERS.length;i++){
                        if(SPEEDTEST_SERVERS[i].pingT==-1) continue;
                        if(SPEEDTEST_SERVERS[i].serveropen==="YES"){
                            var option=document.createElement("option");
                            option.value=i;
                            option.textContent=SPEEDTEST_SERVERS[i].name;
                            I("server").appendChild(option);
                        }
                    }
                    var optionSeparator=document.createElement("option");
                    optionSeparator.disabled=true;
                    optionSeparator.textContent="─────────────────";
                    I("server").appendChild(optionSeparator);
                    var optionAllAvailable=document.createElement("option");
                    optionAllAvailable.value="all_available";
                    optionAllAvailable.textContent="Все доступные сервера";
                    optionAllAvailable.selected=true;
                    I("server").appendChild(optionAllAvailable);
                    var optionAllFull=document.createElement("option");
                    optionAllFull.value="all_with_filled";
                    optionAllFull.textContent="Все сервера";
                    I("server").appendChild(optionAllFull);
                    I("testWrapper").className="visible";
                    initUI();
                    setTimeout(function(){ startStop(); },1500);
                }else{ noServersAvailable(); }
            });
        }
        if(typeof SPEEDTEST_SERVERS==="string"){
            s.loadServerList(SPEEDTEST_SERVERS,function(servers){
                if(servers==null) noServersAvailable();
                else{ SPEEDTEST_SERVERS=servers; runServerSelect(); }
            });
        }else{
            s.addTestPoints(SPEEDTEST_SERVERS);
            runServerSelect();
        }
    }
    
    function format(d){ d=Number(d); if(d<10) return d.toFixed(2); if(d<100) return d.toFixed(1); return d.toFixed(0); }
    
    var uiData=null;
    var groupTestResults=[];
    var serversToTest=[];
    var currentServer=0;
    var stopAllTests=false;
    
    function startStop(){
        if(s.getState()==3){
            stopAllTests=true;
            serversToTest=[];
            s.abort();
            s.onupdate=null;
            s.onend=null;
            uiData=null;
            I("startStopBtn").className="";
            I("server").disabled=false;
            initUI();
            
            // Анализ и вердикт из того, что успело пройти проверку
            var bestServer = findBestServer(groupTestResults);
            renderVerdictCard(bestServer);
            return;
        }
        I("startStopBtn").className="running";
        I("server").disabled=true;
        
        prepareResultTable();
        
        var selectedValue=I("server").value;
        if(selectedValue==="all_available"||selectedValue==="all_with_filled"){
            prepareMultiTest(selectedValue);
        }else{
            runSingleServerTest();
        }
    }
    
    function prepareResultTable(){
        var currentDateTime = new Date().toLocaleString();
        var timeHtml = '<div style="display:inline-flex; align-items:center; gap:6px; color:var(--text-muted);">' +
                       '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>' +
                       '<span>Сгенерировано: ' + currentDateTime + '</span>' +
                       '</div>';

        var timeDiv = document.getElementById("generatedTime");
        if(!timeDiv){
            timeDiv = document.createElement("div");
            timeDiv.id = "generatedTime";
            timeDiv.style.marginTop = "14px";
            timeDiv.style.fontSize = "0.75rem";
            timeDiv.style.textAlign = "center";
            document.getElementById("bottomInfoArea").appendChild(timeDiv);
        }
        timeDiv.innerHTML = timeHtml;

        var resultsTableWrap = document.getElementById("multi_results_wrap");
        if(!resultsTableWrap){
            resultsTableWrap = document.createElement("div");
            resultsTableWrap.id = "multi_results_wrap";
            resultsTableWrap.className = "table-wrapper";
            resultsTableWrap.innerHTML = '<table id="multi_results"><thead><tr><th>Сервер</th><th>Ping</th><th>Jitter</th><th>Скорость</th><th>Статус</th></tr></thead><tbody></tbody></table>';
            document.getElementById("bottomInfoArea").appendChild(resultsTableWrap);
        } else {
            document.getElementById("multi_results").getElementsByTagName('tbody')[0].innerHTML = '';
        }
    }
    
    function runSingleServerTest(){
        var serverIndex=parseInt(I("server").value);
        if(isNaN(serverIndex)) return;
        var serverObj=SPEEDTEST_SERVERS[serverIndex];
        document.getElementById("currentTest").innerHTML="<span style='color:var(--cyan); font-size:13px;'>Тестируется: <strong>"+serverObj.name+"</strong></span>";
        s.setSelectedServer(serverObj);
        s.onupdate=function(data){ uiData=data; };
        s.onend=function(aborted){
            I("startStopBtn").className="";
            I("server").disabled=false;
            updateUI(true);
            if(!aborted && uiData){
                appendResult(serverObj.name,serverObj.serveropen,uiData.dlStatus,uiData.pingStatus,uiData.jitterStatus);
                renderVerdictCard({
                    name: serverObj.name,
                    dl: Number(uiData.dlStatus),
                    ping: Number(uiData.pingStatus),
                    jitter: Number(uiData.jitterStatus),
                    rating: getServerRating(uiData.jitterStatus, uiData.dlStatus, uiData.pingStatus)
                });
            }
        };
        s.start();
    }
    
    function prepareMultiTest(groupType){
        stopAllTests=false;
        groupTestResults=[];
        currentServer=0;
        serversToTest=[];
        for(var i=0;i<SPEEDTEST_SERVERS.length;i++){
            if(SPEEDTEST_SERVERS[i].pingT==-1) continue;
            if(groupType==="all_available" && SPEEDTEST_SERVERS[i].serveropen!=="YES") continue;
            serversToTest.push(i);
        }
        if(serversToTest.length>0){
            currentServer=serversToTest[0];
            document.getElementById("currentTest").innerHTML="<span style='color:var(--cyan); font-size:13px;'>Тестируется: <strong>"+SPEEDTEST_SERVERS[currentServer].name+"</strong> (1 из "+serversToTest.length+")</span>";
            s.setSelectedServer(SPEEDTEST_SERVERS[currentServer]);
            startMultiTest();
        }else{
            I("startStopBtn").className="";
            I("server").disabled=false;
            I("currentTest").innerHTML="<span style='color:var(--text-muted); font-size:13px;'>Нет серверов для проверки</span>";
        }
    }
    
    function startMultiTest(){
        if(s.getState()==3){ s.abort(); I("startStopBtn").className=""; I("server").disabled=false; return; }
        var testTimeout=null;
        var testCompleted=false;
        testTimeout=setTimeout(function(){
            if(!testCompleted && s.getState()==3){
                testCompleted=true;
                appendResult(SPEEDTEST_SERVERS[currentServer].name,SPEEDTEST_SERVERS[currentServer].serveropen,"Таймаут","Таймаут","Таймаут");
                groupTestResults.push({index:currentServer,name:SPEEDTEST_SERVERS[currentServer].name,serveropen:SPEEDTEST_SERVERS[currentServer].serveropen,dl:"Таймаут",ping:"Таймаут",jitter:"Таймаут"});
                if(s.getState()==3) s.abort();
                setTimeout(function(){ if(!stopAllTests) moveToNextServer(); },500);
            }
        },30000);
        s.onupdate=function(data){ uiData=data; };
        s.onend=function(aborted){
            clearTimeout(testTimeout);
            if(testCompleted) return;
            testCompleted=true;
            if(stopAllTests){
                I("startStopBtn").className=""; I("server").disabled=false;
                var bestServer = findBestServer(groupTestResults);
                renderVerdictCard(bestServer);
                return;
            }
            if(!uiData) uiData={dlStatus:0,pingStatus:999,jitterStatus:999};
            var dlValue=(uiData.dlStatus>0)?uiData.dlStatus:0;
            var pingValue=(uiData.pingStatus<999)?uiData.pingStatus:0;
            var jitterValue=(uiData.jitterStatus<999)?uiData.jitterStatus:0;
            if(aborted && dlValue===0){
                appendResult(SPEEDTEST_SERVERS[currentServer].name,SPEEDTEST_SERVERS[currentServer].serveropen,"Таймаут","Таймаут","Таймаут");
                groupTestResults.push({index:currentServer,name:SPEEDTEST_SERVERS[currentServer].name,serveropen:SPEEDTEST_SERVERS[currentServer].serveropen,dl:"Таймаут",ping:"Таймаут",jitter:"Таймаут"});
            }else{
                appendResult(SPEEDTEST_SERVERS[currentServer].name,SPEEDTEST_SERVERS[currentServer].serveropen,dlValue,pingValue,jitterValue);
                groupTestResults.push({index:currentServer,name:SPEEDTEST_SERVERS[currentServer].name,serveropen:SPEEDTEST_SERVERS[currentServer].serveropen,dl:dlValue,ping:pingValue,jitter:jitterValue});
            }
            moveToNextServer();
        };
        s.start();
    }
    
    function appendResult(server,serveropen,dl,ping,jitter){
        var statusBadge=getTableBadge(jitter,dl,ping);
        var pingDisplay=ping;
        if(ping==="Таймаут"||ping==="STOP"){ pingDisplay=ping; }
        else if(typeof ping==='number'){ pingDisplay=format(ping)+" ms"; }
        var jitterDisplay=(typeof jitter==='number')?jitter.toFixed(2)+" ms":jitter;
        var dlDisplay=(typeof dl==='number')?dl.toFixed(1)+" Mbps":dl;
        var tbody = document.getElementById("multi_results").getElementsByTagName('tbody')[0];
        if(tbody){
            tbody.innerHTML += '<tr><td><strong>'+server+'</strong></td><td>'+pingDisplay+'</td><td>'+jitterDisplay+'</td><td style="color:var(--cyan); font-weight:700;">'+dlDisplay+'</td><td>'+statusBadge+'</td></tr>';
        }
    }
    
    function isBadValue(v){
        return v===null||v===undefined||v===""||v==="Таймаут"||v==="STOP"||v==="Fail"||isNaN(Number(v));
    }
    
    function parseValues(jitter, dl, ping){
        if(isBadValue(jitter)||isBadValue(dl)||isBadValue(ping)) return null;
        return {jitter:Number(jitter), dl:Number(dl), ping:Number(ping)};
    }
    
    function calculateIPTVScore(jitter, dl, ping){
        var data = parseValues(jitter, dl, ping);
        if (!data) return { valid: false, score: 0 };

        var j = data.jitter;
        var d = data.dl;
        var p = data.ping;

        if (d < 15 || p > 150 || j > 25) {
            return { valid: true, score: 0, jitter: j, ping: p, dl: d };
        }

        var score = 0;
        if (d >= 100) { score += 40; }
        else if (d >= 70) { score += 35; }
        else if (d >= 50) { score += 30; }
        else if (d >= 30) { score += 20; }
        else if (d >= 15) { score += 10; }

        if (j <= 3) { score += 40; }
        else if (j <= 5) { score += 35; }
        else if (j <= 10) { score += 25; }
        else if (j <= 15) { score += 15; }
        else if (j <= 25) { score += 5; }

        if (p <= 40) { score += 20; }
        else if (p <= 60) { score += 15; }
        else if (p <= 80) { score += 10; }
        else if (p <= 120) { score += 5; }

        score = Math.max(0, Math.min(100, score));
        return { valid: true, score: score, jitter: j, ping: p, dl: d };
    }
    
    function isServerRecommended(jitter, dl, ping){
        var res = calculateIPTVScore(jitter, dl, ping);
        if (!res.valid) return false;
        if (res.dl < 20 || res.ping > 120 || res.jitter > 15) return false;
        return res.score >= 50;
    }
    
    function getServerRating(jitter, dl, ping){
        var res = calculateIPTVScore(jitter, dl, ping);
        if (dl < 15 || ping > 150 || jitter > 25) return "UNSTABLE";
        if (res.score >= 85 && dl >= 50) return "PERFECT";
        if (res.score >= 70 && dl >= 30) return "OPTIMAL";
        if (res.score >= 50 && dl >= 20) return "STABLE";
        if (res.score >= 20 && dl >= 15) return "MINIMAL";
        return "UNSTABLE";
    }

    function getTableBadge(jitter, dl, ping) {
        var r = getServerRating(jitter, dl, ping);
        if (r === "PERFECT") return '<span class="table-badge tb-ultra">4K ULTRA</span>';
        if (r === "OPTIMAL") return '<span class="table-badge tb-good">FHD+</span>';
        if (r === "STABLE" || r === "MINIMAL") return '<span class="table-badge tb-fair">HD</span>';
        return '<span class="table-badge tb-poor">НЕ СТАБИЛЕН</span>';
    }
    
    function findBestServer(results) {
        if (!results || results.length === 0) return null;
        var best = null;
        var bestScore = -1;
        var bestJitter = Infinity;

        for (var i = 0; i < results.length; i++) {
            var r = results[i];
            var dlNum = (typeof r.dl === 'number') ? r.dl : parseFloat(r.dl);
            var pingNum = (typeof r.ping === 'number') ? r.ping : parseFloat(r.ping);
            var jitterNum = (typeof r.jitter === 'number') ? r.jitter : parseFloat(r.jitter);

            if (isNaN(dlNum) || isNaN(pingNum) || isNaN(jitterNum)) continue;
            if (dlNum < 15 || pingNum > 150 || jitterNum > 25) continue;

            var calc = calculateIPTVScore(jitterNum, dlNum, pingNum);
            if (!calc.valid) continue;

            if (best === null || calc.score > bestScore || (calc.score === bestScore && jitterNum < bestJitter)) {
                best = {
                    name: r.name,
                    dl: dlNum,
                    ping: pingNum,
                    jitter: jitterNum,
                    rating: getServerRating(jitterNum, dlNum, pingNum),
                    score: calc.score
                };
                bestScore = calc.score;
                bestJitter = jitterNum;
            }
        }
        return best;
    }

    function renderVerdictCard(server) {
        if (!server) {
            document.getElementById("currentTest").innerHTML = `
              <div class="verdict-card" style="border-color: rgba(239, 68, 68, 0.4);">
                <div class="verdict-header">
                  <span class="verdict-title">Нет подходящих серверов</span>
                  <span class="verdict-badge badge-bad">Критично</span>
                </div>
                <div class="verdict-metrics">
                  Скорость или стабильность сети недостаточны для прямого IPTV потока.
                </div>
              </div>
            `;
            return;
        }

        var badgeClass = "badge-good";
        var statusName = "Рекомендован";
        if (server.rating === "PERFECT") { badgeClass = "badge-excellent"; statusName = "Идеально (4K UHD)"; }
        else if (server.rating === "OPTIMAL") { badgeClass = "badge-good"; statusName = "Отлично (Full HD)"; }
        else if (server.rating === "STABLE") { badgeClass = "badge-warning"; statusName = "Стабильно (HD)"; }
        else if (server.rating === "MINIMAL") { badgeClass = "badge-warning"; statusName = "Минимальный порог"; }

        document.getElementById("currentTest").innerHTML = `
          <div class="verdict-card">
            <div class="verdict-header">
              <span class="verdict-title">${server.name}</span>
              <span class="verdict-badge ${badgeClass}">${statusName}</span>
            </div>
            <div class="verdict-metrics">
              <div class="metric-item">Скорость: <strong>${server.dl.toFixed(1)} Mbps</strong></div>
              <div class="metric-item">Ping: <strong>${server.ping.toFixed(0)} ms</strong></div>
              <div class="metric-item">Jitter: <strong>${server.jitter.toFixed(2)} ms</strong></div>
            </div>
          </div>
        `;
    }
    
    function moveToNextServer(){
        var currentIndex=serversToTest.indexOf(currentServer);
        if(currentIndex<serversToTest.length-1){
            currentServer=serversToTest[currentIndex+1];
            document.getElementById("currentTest").innerHTML="<span style='color:var(--cyan); font-size:13px;'>Тестируется: <strong>"+SPEEDTEST_SERVERS[currentServer].name+"</strong> ("+(currentIndex+2)+" из "+serversToTest.length+")</span>";
            s.setSelectedServer(SPEEDTEST_SERVERS[currentServer]);
            setTimeout(function(){ startMultiTest(); },500);
        }else{
            I("startStopBtn").className="";
            I("server").disabled=false;
            var bestServer=findBestServer(groupTestResults);
            renderVerdictCard(bestServer);
        }
    }
    
    function updateUI(forced){
        if(!forced&&s.getState()!=3) return;
        if(uiData==null) return;
        var status=uiData.testState;
        I("dlText").textContent=(status==1&&uiData.dlStatus==0)?"0.00":format(uiData.dlStatus);
        I("pingText").textContent=format(uiData.pingStatus);
        I("jitText").textContent=format(uiData.jitterStatus);
    }
    function oscillate(){ return 1+0.02*Math.sin(Date.now()/100); }
    window.requestAnimationFrame=window.requestAnimationFrame||function(cb){ setTimeout(cb,1000/60); };
    function frame(){ requestAnimationFrame(frame); updateUI(); }
    frame();
    function initUI(){
        I("dlText").textContent="0.00";
        I("pingText").textContent="0.00";
        I("jitText").textContent="0.00";
    }
  </script>
</head>
<body>

<div class="container">

  <!-- УЛЬТРАКОМПАКТНАЯ ШАПКА -->
  <header class="glass-card speed-header">
    <div class="main-title">Premium IPTV Speed Test</div>
    <div class="auth-status-wrap">
      <div id="authServerStatus" class="auth-status">
        <span class="status-dot"></span>
        <span>Проверка сервера авторизации...</span>
      </div>
    </div>
  </header>

  <div id="loading" class="glass-card visible">
    <p id="message"><span class="loadCircle"></span>Инициализация измерительных серверов...</p>
  </div>

  <!-- SPEEDTEST CORE -->
  <main id="testWrapper" class="glass-card hidden">
    <div id="serverArea">
      <div class="select-wrap">
        <select id="server"></select>
      </div>
      <div id="startStopBtn" onclick="startStop()"></div>
      <div id="currentTest"></div>
    </div>
    
    <!-- DASHBOARD СЕКТОРНЫХ ЦИФР -->
    <div class="dashboard-grid">
      
      <!-- PING & JITTER -->
      <div class="small-meters-row">
        <div class="digital-card">
          <div class="meter-label">Ping</div>
          <div class="digital-screen">
            <span class="digital-bg">888.88</span>
            <span id="pingText" class="meterText">0.00</span>
          </div>
          <div class="unit-tag">ms</div>
        </div>

        <div class="digital-card">
          <div class="meter-label">Jitter</div>
          <div class="digital-screen">
            <span class="digital-bg">888.88</span>
            <span id="jitText" class="meterText">0.00</span>
          </div>
          <div class="unit-tag">ms</div>
        </div>
      </div>

      <!-- DOWNLOAD SPEED -->
      <div class="digital-card main-meter">
        <div class="meter-label">Скорость загрузки (Download)</div>
        <div class="digital-screen">
          <span class="digital-bg">888.88</span>
          <span id="dlText" class="meterText">0.00</span>
        </div>
        <div class="unit-tag">Mbps</div>
      </div>

    </div>
  </main>

  <!-- IP & DIAGNOSTICS INFO -->
  <div id="bottomInfoArea" class="glass-card">
    <div id="ipLocationInfoDisplay" style="text-align:center; font-size:0.9rem; font-weight:600; line-height:1.4;">
      Определение IP и локации...
    </div>
  </div>

  <footer>© Premium-IPTV 2026 • Speed Test Engine</footer>
</div>

</body>
</html>
